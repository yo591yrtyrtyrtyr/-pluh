<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@csh</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-video: url('mp4mp4.mp4'); 
            --pfp: url('pfp.png'); 
            --accent: #ffffff;
            /* Liquid Glass Variables */
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.12);
            --radius: 20px;
        }

        @font-face { font-family: 'SimSun'; src: local('SimSun'); }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; text-transform: lowercase; }

        body {
            background-color: #000;
            font-family: 'SimSun', serif;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        /* --- VIDEO BACKGROUND --- */
        #bg-video-element {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.4) grayscale(20%);
        }

        .side-icon.spotify-link:hover {
            color: #1DB954 !important;
            filter: drop-shadow(0 0 8px #1DB954) !important;
        }

        /* --- LANDING --- */
        #landing {
            position: fixed; inset: 0;
            background: #000;
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; transition: 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .shake-box { animation: shake 0.2s infinite; }
        #typing-start { font-size: 18px; letter-spacing: 5px; color: #fff; }

        /* --- MAIN UI --- */
        #main-content {
            height: 100vh; display: none;
            justify-content: center; align-items: center;
            opacity: 0; transition: 2s ease;
        }

        .container-wrapper { position: relative; display: flex; align-items: center; }

        /* LIQUID GLASS CARD */
        .bio-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border);
            width: 460px; padding: 45px; 
            border-radius: var(--radius);
            z-index: 2;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        /* --- SIDEBAR --- */
        .social-sidebar {
            position: absolute; left: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); 
            border-left: none;
            height: 200px; width: 50px;
            border-radius: 0 var(--radius) var(--radius) 0;
            display: flex; flex-direction: column; justify-content: space-evenly; align-items: center;
            transform: translateX(-10px); opacity: 0;
            transition: 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .container-wrapper:hover .social-sidebar { transform: translateX(0px); opacity: 1; }
        .side-icon { color: #fff; opacity: 0.5; font-size: 18px; transition: 0.3s; text-decoration: none; }
        .side-icon:hover { opacity: 1; transform: scale(1.1); filter: drop-shadow(0 0 5px #fff); }

        /* --- HEADER --- */
        .card-header { display: flex; align-items: center; gap: 25px; margin-bottom: 30px; }
        .pfp-container { position: relative; width: 80px; height: 80px; }
        .pfp-glow {
            position: absolute; inset: -4px; border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, #fff, transparent);
            animation: spin 3s linear infinite; opacity: 0; transition: 0.8s ease;
        }
        .pfp-container:hover .pfp-glow { opacity: 1; }
        .pfp-img {
            position: relative; width: 100%; height: 100%;
            border-radius: 50%; object-fit: cover;
            border: 1px solid rgba(255,255,255,0.3); z-index: 2; background: #000;
        }

        /* --- TEXT STYLES --- */
        .username { font-size: 26px; color: #fff; letter-spacing: 2px; }
        .bio-typing-area { 
            height: 50px; margin: 15px 0; color: #fff; 
            font-size: 14px; opacity: 0.8; line-height: 1.4;
        }

        .lottery-text {
            font-size: 10px; color: #fff; opacity: 0.4;
            font-family: monospace; letter-spacing: 1px;
        }

        /* --- SKILLS --- */
        .skills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 25px 0; }
        .skill-name { font-size: 10px; color: #fff; opacity: 0.6; margin-bottom: 6px; display: block; }
        .bar { height: 1px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        .fill { height: 100%; background: #fff; box-shadow: 0 0 8px #fff; }

        /* --- FOOTER UI --- */
        .footer-ui {
            margin-top: 30px; padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center;
        }
        .vol-control { display: flex; align-items: center; gap: 8px; font-size: 10px; color: #fff; }
        input[type="range"] { -webkit-appearance: none; background: #444; height: 1px; accent-color: #fff; width: 50px; }

        .views-box { display: flex; align-items: center; gap: 5px; font-size: 11px; opacity: 0.4; }

        /* --- ANIMATIONS --- */
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes shake { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(1px, -1px); } 75% { transform: translate(-1px, 1px); } }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <video id="bg-video-element" loop="" playsinline="" src="mp4mp4.mp4"></video>

    <div id="landing" onclick="enterSite()" style="opacity: 0; display: none;">
        <div class="shake-box">
            <span id="typing-start">click to enter</span><span style="border-left: 2px solid #fff; margin-left: 5px; animation: blink 0.7s infinite;"></span>
        </div>
    </div>

    <div id="main-content" style="display: flex; opacity: 1;">
        <div class="container-wrapper">
            <div class="bio-card">
                <div class="card-header">
                    <div class="pfp-container">
                        <div class="pfp-glow"></div>
                        <img src="https://cdn.discordapp.com/avatars/1449409923438874649/38c41730a9e7e2a7d5697b56767c26d5.webp?size=1024" class="pfp-img"> 
                    </div>
                    <div class="info">
                        <div class="username" onclick="copyUID()">skidderandlarper [@dex] <i class="fa-solid fa-circle-check" style="font-size: 12px;"></i></div>
                        <div id="uid-val" class="lottery-text">uid: 121476612</div>
                    </div>
                </div>

                <div class="bio-typing-area shake-box">
                    <span id="typing-bio">fuck you breachers anticheat for banning me on t</span><span style="border-left: 1px solid #fff; margin-left: 3px; animation: blink 0.9s infinite;"></span>
                </div>

                <div class="skills-grid">
                    <div><span class="skill-name">python</span><div class="bar"><div class="fill" style="width: 0%"></div></div></div>
                    <div><span class="skill-name">javascript</span><div class="bar"><div class="fill" style="width: 1%"></div></div></div>
                    <div><span class="skill-name">c++</span><div class="bar"><div class="fill" style="width: 15%"></div></div></div>
                    <div><span class="skill-name">c#</span><div class="bar"><div class="fill" style="width: 95%"></div></div></div>
                    <div><span class="skill-name">lua</span><div class="bar"><div class="fill" style="width: 0%"></div></div></div>
                    <div><span class="skill-name"><html></html></span><div class="bar"><div class="fill" style="width: 85%"></div></div></div>
                </div>

                <div class="footer-ui">
                    <div class="vol-control">
                        <i class="fa-solid fa-volume-off"></i>
                        <input type="range" id="vol" min="0" max="1" step="0.01" value="0.5">
                    </div>
                    <div class="views-box">
                        <i class="fa-solid fa-eye"></i>
                        <span id="views-val" class="lottery-text" style="opacity: 1;">0093</span>
                    </div>
                </div>
            </div>

            <div class="social-sidebar">
                <a href="https://github.com/v8modding" target="_blank" class="side-icon">
                    <i class="fab fa-github"></i>
                </a>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('bg-video-element');
        const volSlider = document.getElementById('vol');

        // --- CONSTANT LOTTERY ENGINE ---
        function runConstantLottery() {
            setInterval(() => {
                document.getElementById('uid-val').textContent = "uid: " + Math.floor(Math.random() * 999999999).toString().padStart(9, '0');
                document.getElementById('views-val').textContent = Math.floor(Math.random() * 9999).toString().padStart(4, '0');
            }, 80);
        }
        runConstantLottery();

        // --- TYPING ENGINE ---
        function setupTyping(elementId, phrases) {
            let p=0, c=0, d=false;
            const el = document.getElementById(elementId);
            function type() {
                const txt = phrases[p];
                el.textContent = d ? txt.substring(0, c--) : txt.substring(0, c++);
                if(!d && c > txt.length) { d=true; setTimeout(type, 2000); }
                else if(d && c < 0) { d=false; p=(p+1)%phrases.length; setTimeout(type, 500); }
                else { setTimeout(type, d?50:120); }
            }
            type();
        }

        setupTyping("typing-start", ["click to enter", "click to see", "click to find it", "click if you dare bub", "guns.lol copy by gemini thinking + fast let's go - crimson.h"]);
        setupTyping("typing-bio", [
  	    ".gg/bynamelarp
            "i mod for fun most of the time", 
            "13yo on the cord", 
            "mod maker in bus",
	    "mod maker in null client",
        ]);

        function enterSite() {
            document.getElementById('landing').style.opacity = '0';
            video.play();
            setTimeout(() => {
                document.getElementById('landing').style.display = 'none';
                const m = document.getElementById('main-content');
                m.style.display = 'flex';
                setTimeout(() => m.style.opacity = '1', 50);
            }, 1000);
        }

        function copyUID() {
            navigator.clipboard.writeText("772910332");
            alert("uid copied");
        }

        volSlider.oninput = (e) => { video.volume = e.target.value; };
    </script>

</body></html>
